# .husky/naming.conf — naming conventions for THIS project.
#
# Sourced by .husky/commit-msg, .husky/pre-push, and scripts/branch-start.sh.
# Edit freely — hooks reload this file on every run.
#
# Format: plain shell KEY='VALUE'. No expansions, no command substitution.
#
# To DISABLE a single check, set its *_REGEX to '' (empty string).
# To DISABLE all checks, delete this file or empty all *_REGEX values.

# --- Commit message ---
# Regex matched (extended, ERE) against the first line of the commit message.
# Empty value = no validation.
COMMIT_MSG_REGEX='^\[(FEATURE|BUGFIX|HOTFIX|REFACT|TEST|DOCS|CHORE|STYLE|PERF|CI|BUILD|REVERT)\]#[0-9]+: .{1,72}$'
COMMIT_MSG_FORMAT='[<TYPE>]#<taskNumber>: <description>'
COMMIT_MSG_EXAMPLE='[FEATURE]#12345: add refresh token rotation'

# --- Branch name ---
# Regex matched (extended, ERE) against the full branch name.
# Empty value = no validation. (Protected-branch push-block stays on regardless.)
BRANCH_NAME_REGEX='^(feature|bugfix|hotfix|refact|test|docs|chore|style|perf|ci|build|revert)/.+$'
BRANCH_NAME_FORMAT='<type>/<card-number>/<slug>'
BRANCH_NAME_EXAMPLE='feature/12345/login-redirect'

# --- Presets you can paste over the defaults above ---
#
# Conventional Commits (community standard):
#   COMMIT_MSG_REGEX='^(feat|fix|refactor|test|docs|chore|style|perf|ci|build|revert)(\(.+\))?: .{1,72}$'
#   COMMIT_MSG_FORMAT='<type>(<scope>): <description>'
#   COMMIT_MSG_EXAMPLE='feat(auth): add refresh token rotation'
#   BRANCH_NAME_REGEX='^(feat|fix|refactor|chore|test|docs|perf|style)/.+$'
#   BRANCH_NAME_FORMAT='<type>/<slug>'
#   BRANCH_NAME_EXAMPLE='feat/login-redirect'
#
# Jira-tagged (e.g. "PROJ-123: ..."):
#   COMMIT_MSG_REGEX='^[A-Z]+-[0-9]+: .{1,72}$'
#   COMMIT_MSG_FORMAT='<JIRA-KEY>: <description>'
#   COMMIT_MSG_EXAMPLE='PROJ-123: add refresh token rotation'
#   BRANCH_NAME_REGEX='^[A-Z]+-[0-9]+/.+$'
#   BRANCH_NAME_FORMAT='<JIRA-KEY>/<slug>'
#   BRANCH_NAME_EXAMPLE='PROJ-123/login-redirect'
